name: hris_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Library untuk UI
  google_fonts: ^6.2.1
  intl: ^0.20.2
  # Library untuk Kamera & GPS
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  # Library untuk koneksi API
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/logo-hrms.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/logo-hrms.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/logo/logo-hrms.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/logo-hrms.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/