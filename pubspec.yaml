name: hris_mobile
description: "HRIS Dignity - Human Resource Information System"
publish_to: 'none'

version: 2.2.0+22

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Library untuk UI
  google_fonts: ^6.2.1
  intl: ^0.20.2
  # Library untuk Kamera & GPS
  image_picker: ^1.1.2
  image: 4.3.0
  file_picker: ^8.1.4
  geolocator: ^13.0.2
  # Library untuk koneksi API
  http: ^1.3.0
  # Library untuk penyimpanan sesi login
  shared_preferences: ^2.3.3
  
  url_launcher: ^6.3.0
  # Library untuk export laporan Excel
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  flutter_local_notifications: 18.0.1
  timezone: 0.10.1
  permission_handler: 11.3.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dependency_overrides:
  # `excel` masih butuh archive 3.x, sedangkan `image` (dipakai tooling
  # flutter_launcher_icons saja, bukan runtime) menarik archive 4.x.
  image: 4.3.0
  archive: 3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Untuk membaca isi file xlsx di test export laporan.
  archive: ^3.6.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/icon-dignity.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logo/icon-dignity.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/logo/icon-dignity.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo/icon-dignity.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/avatars/